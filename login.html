<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alphabet English Academy</title>
    <link href="./src/output.css" rel="stylesheet" />

</head>
<body>
    <header class="hrader bg-background/50 sticky">
        <div class="container flex justify-between text-center items-center py-3.5">
            <div class="row gap-12 justify-between">
                <div class="logo">
                    <a href="./index.html" class="logo-font">
                        Alphabet English Academy
                    </a>
                </div>
            </div>
            <div class="menu md:hidden hover:cursor-pointer">
                <img src="./Assets/imgs/index-page/header/menu.svg" alt="Menu" />
            </div>    
            <div class="hidden md:row">
                <ul class="flex gap-[7.99px]">
                    <li><button class=""><img src="./Assets/imgs/index-page/header/lang.svg" alt="language" /></button></li>
                    <li><a href="./login.html"><img src="./Assets/imgs/index-page/header/avatar.svg" alt="avatar" /></a>
                    </li>
                </ul>
            </div>
        </div>
    </header>
    <section class="LogIn-Container py-14">
        <div class="container col gap-8">
            <div class="logo">
                <a href="./index.html" class="logo-font">Alphabet English Academy</a>
            </div>
            <div class="col gap-8 p-12 border border-border/30 rounded-xl">
                <div class="col gap-1.5">
                    <h2>Welcome Back</h2>
                    <p>Continue your journey to English mastery.</p>
                </div>
                <div class="FORM col w-full">
                    <form action="#" method="post" class="col gap-6 w-full">
                        <div class="col items-start gap-2.5 w-full">
                            <label class="text-sm/5 font-medium text-bold" for="email">Email Address</label>
                            <div class="row gap-3 border border-border rounded-lg bg-[#FAF8FF] py-3.5 px-4 w-full focus-within:border-primary focus-within:ring-2 focus-within:ring-primary">
                                <img src="./Assets/imgs/Login-Reg-Page/mail.svg" alt="eMail icone" />
                                <input class="w-full focus:border-primary outline-none font-normal text-base/[100%]" type="email" id="email" name="email" placeholder="name@example.com" required  />
                            </div>
                        </div>
                        <div class="col items-start gap-2.5 w-full">
                            <div class="row justify-between w-full">
                                <label class="text-sm/5 font-medium text-bold" for="password">Password</label>
                                <a class="text-sm/5 font-medium text-primary" href="#">Forgot Password?</a>
                            </div>
                            <div class="row justify-between border border-border rounded-lg bg-[#FAF8FF] py-3.5 px-4 w-full focus-within:border-primary focus-within:ring-2 focus-within:ring-primary">
                                <div class="row gap-3 w-full">
                                    <img src="./Assets/imgs/Login-Reg-Page/lock.svg" alt="lock icone" />
                                    <input class="w-full focus:border-primary outline-none font-normal text-base/[100%]"
                                        type="password" id="password" name="password" placeholder="••••••••" required  />
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                
            </div>
            <div class="row">
                <img src="./Assets/imgs/Login-Reg-Page/qMark.svg" alt="Qustion Mark">
                <span class="text-sm/5 font-medium text-bold">Contact Academy Support</span>
            </div>
            
        </div>
        
    </section>
</body>
</html>
